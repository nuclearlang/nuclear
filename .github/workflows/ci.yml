# The language: the compiler, the CLI and the language server, the specs of the language dialects.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nuclear
      - name: The other repositories of the working tree
        run: |
          git clone --depth 1 https://github.com/nuclearlang/dragonfly nuclear/dragonfly
          git clone --depth 1 https://github.com/nuclearlang/dragonfly-mobile nuclear/dragonfly-mobile
          git clone --depth 1 https://github.com/nuclearlang/dragonfly-backend nuclear/dragonfly-backend
          git clone --depth 1 https://github.com/nuclearlang/dragonfly-web nuclear/dragonfly-web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: "Tests and clippy"
        working-directory: nuclear
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
      - name: "The specs' equivalences"
        working-directory: nuclear
        run: |
          python3 tools/spec-check/check.py spec/typescript.md typescript typescript
          python3 tools/spec-check/check.py spec/dart.md dart dart
          python3 tools/spec-check/check.py spec/python.md python python
