# How Python writes Nuclear's standard library (spec/library.md, ADR-0094; spec/python.md §9).
# Variables: recv, args, argN, has_args, named.<name>, fn.param/fn.params/fn.body (an expression lambda argument:
# a comprehension), argN_is.<base> (the static type of an argument), elem, type_args. A `helper` is written once
# per file. Lists are list, maps dict, sets set, Bytes is bytes, DateTime is datetime.datetime (aware when UTC),
# Duration is datetime.timedelta, Regex is re.Pattern and Match is re.Match; `string.length` counts code points.

[library.string]
length = 'len({{recv}})'
isEmpty = 'len({{recv}}) == 0'
codeAt = 'ord({{recv}}[{{arg0}}])'
upper = '{{recv}}.upper()'
lower = '{{recv}}.lower()'
trim = '{{recv}}.strip()'
trimStart = '{{recv}}.lstrip()'
trimEnd = '{{recv}}.rstrip()'
startsWith = '{{recv}}.startswith({{args}})'
endsWith = '{{recv}}.endswith({{args}})'
indexOf = '{{recv}}.find({{args}})'
lastIndexOf = '{{recv}}.rfind({{args}})'
substring = '{{recv}}[{{arg0}}:{{#arg1}}{{arg1}}{{/arg1}}]'
split = '{{#arg0_is.regex}}{{arg0}}.split({{recv}}){{/arg0_is.regex}}{{^arg0_is.regex}}{{recv}}.split({{arg0}}){{/arg0_is.regex}}'
chars = 'list({{recv}})'
replace = '{{recv}}.replace({{arg0}}, {{arg1}}, 1)'
replaceAll = '{{#arg0_is.regex}}{{arg0}}.sub({{arg1}}, {{recv}}){{/arg0_is.regex}}{{^arg0_is.regex}}{{recv}}.replace({{arg0}}, {{arg1}}){{/arg0_is.regex}}'
repeat = '{{recv}} * {{arg0}}'
padStart = '{{recv}}.rjust({{arg0}}{{#arg1}}, {{arg1}}{{/arg1}})'
padEnd = '{{recv}}.ljust({{arg0}}{{#arg1}}, {{arg1}}{{/arg1}})'
toInt = { template = '_to_int({{recv}})', helper = """
def _to_int(s: str) -> int | None:
    try:
        return int(s)
    except ValueError:
        return None""" }
toDouble = { template = '_to_double({{recv}})', helper = """
def _to_double(s: str) -> float | None:
