filter = '{{#fn}}[{{fn.param}} for {{fn.param}} in {{recv}} if {{fn.body}}]{{/fn}}{{^fn}}list(filter({{arg0}}, {{recv}})){{/fn}}'
find = '{{#fn}}next(({{fn.param}} for {{fn.param}} in {{recv}} if {{fn.body}}), None){{/fn}}{{^fn}}next((x for x in {{recv}} if {{arg0}}(x)), None){{/fn}}'
