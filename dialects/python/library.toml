floor = 'math.floor({{recv}})'
ceil = 'math.ceil({{recv}})'
truncate = 'math.trunc({{recv}})'
toFixed = 'f"{{{recv}}:.{{{arg0}}}f}"'
toInt = 'int({{recv}})'
toDouble = 'float({{recv}})'
toRadix = { template = '_to_radix({{recv}}, {{arg0}})', helper = """
def _to_radix(n: int, base: int) -> str:
    digits = "0123456789abcdefghijklmnopqrstuvwxyz"
    if n == 0:
        return "0"
    out = ""
    value = abs(n)
    while value:
        out = digits[value % base] + out
        value //= base
    return "-" + out if n < 0 else out""" }

