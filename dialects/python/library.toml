[library.Regex]
new = { template = '_regex({{arg0}}{{#named.ignoreCase}}, ignore_case=True{{/named.ignoreCase}}{{#named.multiline}}, multiline=True{{/named.multiline}})', helper = '''
def _regex(pattern: str, ignore_case: bool = False, multiline: bool = False) -> re.Pattern[str]:
    # named groups are written (?<name>...) in Nuclear, as in every other regex tool; Python wants (?P<name>...)
    flags = (re.IGNORECASE if ignore_case else 0) | (re.MULTILINE if multiline else 0)
    return re.compile(re.sub(r"\(\?<(?![=!])", "(?P<", pattern), flags)''' }

