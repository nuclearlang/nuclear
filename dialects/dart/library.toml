lastIndexOf = "{{recv}}.lastIndexOf({{args}})"
substring = "{{recv}}.substring({{args}})"
split = "{{recv}}.split({{arg0}})"
chars = "{{recv}}.runes.map((r) => String.fromCharCode(r)).toList()"
replace = "{{recv}}.replaceFirst({{arg0}}, {{arg1}})"
replaceAll = "{{#fn}}{{recv}}.replaceAllMapped({{arg0}}, {{arg1}}){{/fn}}{{^fn}}{{recv}}.replaceAll({{arg0}}, {{arg1}}){{/fn}}"
repeat = "{{recv}} * {{arg0}}"
padStart = "{{recv}}.padLeft({{args}})"
padEnd = "{{recv}}.padRight({{args}})"
toInt = "int.tryParse({{recv}})"
toDouble = "double.tryParse({{recv}})"
compareTo = "{{recv}}.compareTo({{arg0}})"
toBytes = "utf8.encode({{recv}})"

