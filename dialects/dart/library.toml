reduce = "{{recv}}.fold({{arg0}}, {{arg1}})"
sum = "{{recv}}.fold(0, (a, b) => a + b)"
min = { template = "_min({{recv}})", helper = "T? _min<T extends Comparable<dynamic>>(List<T> xs) =>\n    xs.isEmpty ? null : xs.reduce((a, b) => a.compareTo(b) <= 0 ? a : b);" }
max = { template = "_max({{recv}})", helper = "T? _max<T extends Comparable<dynamic>>(List<T> xs) =>\n    xs.isEmpty ? null : xs.reduce((a, b) => a.compareTo(b) >= 0 ? a : b);" }
join = "{{recv}}.join({{#has_args}}{{arg0}}{{/has_args}})"
slice = "{{recv}}.sublist({{args}})"
take = "{{recv}}.take({{arg0}}).toList()"
skip = "{{recv}}.skip({{arg0}}).toList()"
reversed = "{{recv}}.reversed.toList()"
sorted = "(List.of({{recv}})..sort())"
sortedBy = { template = "_sortBy(List.of({{recv}}), {{arg0}})", helper = "List<T> _sortBy<T, K extends Comparable<dynamic>>(List<T> xs, K Function(T) key) =>\n    xs..sort((a, b) => key(a).compareTo(key(b)));" }
reverse = { template = "_reverse({{recv}})", helper = "void _reverse<T>(List<T> xs) => xs.setAll(0, xs.reversed.toList());" }
sort = "{{recv}}.sort()"
sortBy = { template = "_sortBy({{recv}}, {{arg0}})", helper = "List<T> _sortBy<T, K extends Comparable<dynamic>>(List<T> xs, K Function(T) key) =>\n    xs..sort((a, b) => key(a).compareTo(key(b)));" }
unique = "{{recv}}.toSet().toList()"
flatten = "{{recv}}.expand((x) => x).toList()"
copy = "List.of({{recv}})"
groupBy = { template = "_groupBy({{recv}}, {{arg0}})", helper = "Map<K, List<T>> _groupBy<T, K>(List<T> xs, K Function(T) key) {\n  final out = <K, List<T>>{};\n  for (final x in xs) {\n    (out[key(x)] ??= []).add(x);\n  }\n  return out;\n}" }

