# How Dart writes Nuclear's standard library (spec/library.md, ADR-0094; spec/dart.md §9).
# Variables: recv, args, argN, has_args, named.<name>, fn.param/fn.params/fn.body (an expression lambda argument),
# argN_is.<base> (the static type of an argument), elem, type_args. A `helper` is written once per file.
# Lists are List, maps Map, sets Set, Bytes is Uint8List (dart:typed_data), DateTime and Duration are Dart's,
# Regex is RegExp and Match is RegExpMatch; dart:math and dart:convert are imported when their names are written.

